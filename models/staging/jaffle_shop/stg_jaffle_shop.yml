version: 2

models:
  - name: stg_jaffle_shop__customers
    description: Staged customer data from our Jaffle shop app
    columns:
      - name: customer_id
        description: Primary Key for Customer data.
        tests:
          - unique
          - not_null

  - name: stg_jaffle_shop__orders
    description: Stagged order data from our Jaffle shop.
    columns:
      - name: order_id
        description: Primary Key for orders.
        tests:
          - unique
          - not_null
      - name: status
        description: "{{ doc('order_status') }}"
        tests:
          - accepted_values:
              values:
                - completed
                - shipped
                - returned
                - return_pending
                - placed
      - name: customer_id
        description: Identification of Customer linked to the order.
        tests:
          - relationships:
              field: customer_id
              to: ref('stg_jaffle_shop__customers')